name: RuneLite compatibility

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-latest-runelite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
      - name: Allow the Gradle wrapper to run
        run: chmod +x gradlew
      - name: Build against the latest RuneLite release
        run: ./gradlew clean test --refresh-dependencies
